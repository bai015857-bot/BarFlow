name: macOS build and tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Apple Silicon / seven test suites
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Inspect toolchain
        run: |
          uname -m
          sw_vers
          xcrun swiftc --version
          test "$(uname -m)" = arm64
      - name: Run tests and packaged safe smoke
        run: python3 scripts/verify-all.py
      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-verification
          path: |
            .build/verification/
            .build/diagnose.json
            .build/smoke.json
          retention-days: 7
